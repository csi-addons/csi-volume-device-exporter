apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: csi-volume-device-exporter
# The exporter uses read-only hostPath mounts and explicitly requests the
# spc_t:s0 SELinux context to read host metadata. RunAsAny permits this context
# but does not assign it; the DaemonSet must request it.
# spc_t grants broad SELinux access. This custom SCC still disallows privileged
# containers, hostPID, host networking, host ports, and host IPC.
# mountPropagation: HostToContainer on /var/lib/kubelet makes the host's CSI
# mounts visible via stat(), eliminating the need for hostPID or a separate
# /proc bind mount.
allowPrivilegedContainer: false
allowHostDirVolumePlugin: true
allowHostPID: false
allowHostIPC: false
allowHostPorts: false
allowHostNetwork: false
readOnlyRootFilesystem: true
runAsUser:
  type: MustRunAs
  uid: 0
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - hostPath
users:
  - system:serviceaccount:csi-volume-device-exporter:csi-volume-device-exporter
