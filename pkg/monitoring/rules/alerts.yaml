apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
    name: csi-volume-path-health
    labels:
        app.kubernetes.io/name: csi-volume-device-exporter
spec:
    groups:
        - name: csi-volume-path-health
          rules:
            - alert: CSIAddonsVolumeMultipathDegraded
              expr: |-
                (label_replace(
                  label_replace(
                    kube_persistentvolume_info,
                    "volume_handle", "$1", "csi_volume_handle", "(.+)"
                  )
                  * on(volume_handle) group_left(device, node, driver)
                  csiaddons_volume_node_device_info,
                  "sysfs_name", "$1", "device", "(.*)"
                )
                * on(sysfs_name, node) group_left(device)
                label_replace(node_dmmultipath_device_info, "node", "$1", "instance", "(.+)"))
                * on(device, node) group_left()
                (
                  count by(device, node) (
                    label_replace(node_dmmultipath_path_state{state!~"running|live"}, "node", "$1", "instance", "(.+)") == 1
                  ) > 0
                )
              for: 5m
              labels:
                severity: warning
              annotations:
                description: At least one path to the multipath device has failed. Storage is still accessible via remaining paths but redundancy is lost.
                runbook_url: https://github.com/csi-addons/csi-volume-device-exporter/blob/main/docs/runbooks/CSIAddonsVolumeMultipathDegraded.md
                summary: PV {{ $labels.persistentvolume }} on {{ $labels.node }} has degraded multipath (device {{ $labels.device }})
            - alert: CSIAddonsVolumeMultipathLost
              expr: |-
                (label_replace(
                  label_replace(
                    kube_persistentvolume_info,
                    "volume_handle", "$1", "csi_volume_handle", "(.+)"
                  )
                  * on(volume_handle) group_left(device, node, driver)
                  csiaddons_volume_node_device_info,
                  "sysfs_name", "$1", "device", "(.*)"
                )
                * on(sysfs_name, node) group_left(device)
                label_replace(node_dmmultipath_device_info, "node", "$1", "instance", "(.+)"))
                * on(device, node) group_left()
                (
                  label_replace(node_dmmultipath_device_paths_active, "node", "$1", "instance", "(.+)") == 0
                )
              for: 1m
              labels:
                severity: critical
              annotations:
                description: All paths to the multipath device are down. I/O is likely failing. Immediate investigation of storage connectivity on node {{ $labels.node }} is required.
                runbook_url: https://github.com/csi-addons/csi-volume-device-exporter/blob/main/docs/runbooks/CSIAddonsVolumeMultipathLost.md
                summary: PV {{ $labels.persistentvolume }} on {{ $labels.node }} has lost all multipath paths (device {{ $labels.device }})
            - alert: CSIAddonsVolumeNVMeSubsystemDegraded
              expr: |-
                (label_replace(
                  kube_persistentvolume_info,
                  "volume_handle", "$1", "csi_volume_handle", "(.+)"
                )
                * on(volume_handle) group_left(device, node, driver)
                csiaddons_volume_node_device_info{device=~"nvme.*"}
                * on(device, node) group_left(subsystem)
                label_replace(node_nvmesubsystem_namespace_info, "node", "$1", "instance", "(.+)"))
                * on(subsystem, node) group_left()
                (
                  label_replace(node_nvmesubsystem_paths, "node", "$1", "instance", "(.+)")
                  - label_replace(node_nvmesubsystem_paths_live, "node", "$1", "instance", "(.+)") > 0
                )
              for: 5m
              labels:
                severity: warning
              annotations:
                description: At least one NVMe-oF controller path is not live. Storage is still accessible via remaining controllers but redundancy is lost.
                runbook_url: https://github.com/csi-addons/csi-volume-device-exporter/blob/main/docs/runbooks/CSIAddonsVolumeNVMeSubsystemDegraded.md
                summary: PV {{ $labels.persistentvolume }} on {{ $labels.node }} has degraded NVMe-oF subsystem ({{ $labels.subsystem }})
            - alert: CSIAddonsVolumeNVMeSubsystemLost
              expr: |-
                (label_replace(
                  kube_persistentvolume_info,
                  "volume_handle", "$1", "csi_volume_handle", "(.+)"
                )
                * on(volume_handle) group_left(device, node, driver)
                csiaddons_volume_node_device_info{device=~"nvme.*"}
                * on(device, node) group_left(subsystem)
                label_replace(node_nvmesubsystem_namespace_info, "node", "$1", "instance", "(.+)"))
                * on(subsystem, node) group_left()
                (
                  label_replace(node_nvmesubsystem_paths_live, "node", "$1", "instance", "(.+)") == 0
                )
              for: 1m
              labels:
                severity: critical
              annotations:
                description: All NVMe-oF controller paths are dead. I/O is likely failing. Immediate investigation of storage connectivity on node {{ $labels.node }} is required.
                runbook_url: https://github.com/csi-addons/csi-volume-device-exporter/blob/main/docs/runbooks/CSIAddonsVolumeNVMeSubsystemLost.md
                summary: PV {{ $labels.persistentvolume }} on {{ $labels.node }} has lost all NVMe-oF controller paths ({{ $labels.subsystem }})
            - alert: CSIAddonsVolumeDeviceExporterDown
              expr: absent(up{job="csi-volume-device-exporter"}) == 1
              for: 5m
              labels:
                operator_health_impact: warning
                severity: warning
              annotations:
                description: No csi-volume-device-exporter targets have been scraped for 5 minutes. Storage path health for CSI volumes cannot be reported.
                runbook_url: https://github.com/csi-addons/csi-volume-device-exporter/blob/main/docs/runbooks/CSIAddonsVolumeDeviceExporterDown.md
                summary: CSI volume device exporter is not running
            - alert: CSIAddonsVolumeDeviceExporterNodeDown
              expr: up{job="csi-volume-device-exporter"} == 0
              for: 10m
              labels:
                severity: warning
              annotations:
                description: The csi-volume-device-exporter target on {{ $labels.instance }} has been unreachable for 10 minutes. Storage path health for CSI volumes on this node cannot be reported.
                runbook_url: https://github.com/csi-addons/csi-volume-device-exporter/blob/main/docs/runbooks/CSIAddonsVolumeDeviceExporterDown.md
                summary: CSI volume device exporter is down on {{ $labels.instance }}
